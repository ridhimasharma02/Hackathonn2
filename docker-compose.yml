# =============================================================================
# StockSense Production Architecture Deployment Model (Docker Compose)
# Fully aligned with Section 6 of the StockSense Backend Architecture Specification.
# Zero-License-Cost Open Source Stack: Caddy, FastAPI, PostgreSQL 16, Redis 7.
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    environment:
      - DATABASE_URL=postgresql://stock_usr:stock_pwd@postgres:5432/stocksense
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=env_app_secret_production_key_2026_stocksense
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stock_usr
      POSTGRES_PASSWORD: stock_pwd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
